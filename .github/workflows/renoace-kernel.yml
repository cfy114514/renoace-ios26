name: Reno Ace XNU kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renoace-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RENOACE_CI_OUT: out/renoace-kernel-ci
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out the reviewed device source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned XNU framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: none24smu/UniXNU
          ref: a8b90c0c645fd62ae850cd43e80c87bab4cc157d
          path: out/ci-framework
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Stage the kernel-only device copy
        run: python tools/prepare_renoace_kernel_ci.py --framework out/ci-framework --output "$RENOACE_CI_OUT"

      - name: Verify Xcode and SDKs
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig

      - name: Install kernel build tools
        run: |
          brew install cmake ninja unifdef llvm lld
          printf '%s\n' "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Select the Reno Ace configuration
        run: |
          python out/ci-framework/unixnu defconfig renoace_research_defconfig -D "$RENOACE_CI_OUT/device" --out "$RENOACE_CI_OUT/build" --local-module "patch:xnu-12377=$GITHUB_WORKSPACE/$RENOACE_CI_OUT/patch-modules/xnu-12377" -j 2
          python out/ci-framework/unixnu status -D "$RENOACE_CI_OUT/device" --out "$RENOACE_CI_OUT/build" --local-module "patch:xnu-12377=$GITHUB_WORKSPACE/$RENOACE_CI_OUT/patch-modules/xnu-12377" -j 2

      - name: Fetch pinned kernel sources
        run: python out/ci-framework/unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily -D "$RENOACE_CI_OUT/device" --out "$RENOACE_CI_OUT/build" --local-module "patch:xnu-12377=$GITHUB_WORKSPACE/$RENOACE_CI_OUT/patch-modules/xnu-12377" -j 2

      - name: Build only the unprelinked kernel
        run: |
          python out/ci-framework/unixnu build kernel -D "$RENOACE_CI_OUT/device" --out "$RENOACE_CI_OUT/build" --local-module "patch:xnu-12377=$GITHUB_WORKSPACE/$RENOACE_CI_OUT/patch-modules/xnu-12377" -j 2
          test -s "$RENOACE_CI_OUT/build/renoace/kernel/mach.development.bcm2837.unstripped.noctf"
          python tools/prepare_renoace_kernel_ci.py --output "$RENOACE_CI_OUT" --verify-build

      - name: Collect configuration, toolchain and logs
        if: always()
        run: python tools/prepare_renoace_kernel_ci.py --output "$RENOACE_CI_OUT" --collect

      - name: Upload kernel and review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renoace-xnu-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/renoace-kernel-ci/build/renoace/kernel/
            out/renoace-kernel-ci/evidence/
          if-no-files-found: warn
          retention-days: 14
